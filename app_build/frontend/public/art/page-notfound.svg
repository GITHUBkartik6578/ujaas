<g fill="#6E9A42"><path d="M806 560 q-10 -18 -4 -32 q6 16 4 32Z"></path><path d="M834 560 q10 -16 6 -30 q-8 14 -6 30Z"></path><path d="M820 562 q-2 -20 4 -30 q2 16 -4 30Z"></path></g>
</g>

<g fill="#FFFCF4" stroke="#E2D3B6" stroke-width=".8">
<g class="uj-p1" transform="translate(600 140)"><g class="uj-petal"><ellipse rx="6" ry="3"></ellipse></g></g>
