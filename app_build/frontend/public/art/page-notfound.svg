<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600">
<defs>
<linearGradient id="knSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E7CD"></stop><stop offset=".55" stop-color="#F3E0BF"></stop><stop offset="1" stop-color="#EFD8B2"></stop></linearGradient>
<radialGradient id="knSkyGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF3D6"></stop><stop offset="1" stop-color="#FFF3D6" stop-opacity="0"></stop></radialGradient>
<linearGradient id="knPal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2C79C"></stop><stop offset="1" stop-color="#C9A576"></stop></linearGradient>
<linearGradient id="knRiver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEDCBC"></stop><stop offset="1" stop-color="#E5CDA3"></stop></linearGradient>
<linearGradient id="knFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAD5AF"></stop><stop offset="1" stop-color="#D9BB8C"></stop></linearGradient>
<linearGradient id="knStep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCC6A0"></stop><stop offset="1" stop-color="#C4A87E"></stop></linearGradient>
<linearGradient id="knPage" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F7EBD2"></stop><stop offset=".8" stop-color="#FFF7E6"></stop><stop offset="1" stop-color="#E9D6B2"></stop></linearGradient>
<linearGradient id="knPage2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9D6B2"></stop><stop offset=".2" stop-color="#FFF7E6"></stop><stop offset="1" stop-color="#F4E5C8"></stop></linearGradient>
<linearGradient id="knWood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6E4325"></stop><stop offset=".5" stop-color="#8E5C33"></stop><stop offset="1" stop-color="#5E3820"></stop></linearGradient>
<linearGradient id="knBoard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A6438"></stop><stop offset="1" stop-color="#7A4A28"></stop></linearGradient>
