<g class="kn-board2"><path d="M814 316 H720 L702 334 L720 352 H814Z" fill="url(#knBoard)" stroke="#5E3820" stroke-width="1.4"></path><path d="M808 322 H724 L712 334 L724 346 H808Z" fill="none" stroke="#C99A52" stroke-width="1"></path><text x="762" y="340" text-anchor="middle" font-family="Noto Sans Devanagari, sans-serif" font-size="15" font-weight="700" fill="#FFF3D6">रचनाकार</text></g>
